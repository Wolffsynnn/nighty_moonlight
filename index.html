<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iphax — Expérience Visuelle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            background: #020105; 
            overflow: hidden; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cadre vertical 9:16 */
        #stage {
            position: relative;
            width: min(100vw, 56.25vh);
            height: min(177.78vw, 100vh);
            overflow: hidden;
            background: #020105;
            box-shadow: 0 0 100px rgba(0, 255, 157, 0.1);
        }

        canvas { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            display: block; 
        }

        /* Overlay pour le lien final (uniquement à la fin) */
        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 15%;
            pointer-events: none;
            z-index: 10;
        }

        .cta-btn {
            display: inline-block;
            padding: 18px 40px;
            background: rgba(0, 255, 157, 0.1);
            border: 2px solid #00ff9d;
            color: #00ff9d;
            text-decoration: none;
            font-weight: 800;
            font-size: clamp(16px, 4vw, 22px);
            border-radius: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            transition: all 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .cta-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.3);
        }

        .cta-btn:hover {
            background: #00ff9d;
            color: #020105;
            box-shadow: 0 0 50px rgba(0, 255, 157, 0.6);
        }

        /* Indicateur de chargement */
        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020105;
            z-index: 100;
            transition: opacity 1s;
        }
        .loader.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(0,255,157,0.1);
            border-top-color: #00ff9d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <div id="stage">
        <canvas id="gl"></canvas>
        
        <div class="ui-layer">
            <a href="https://Iphax-fr.vercel.app" target="_blank" class="cta-btn" id="cta">
                Rejoindre Iphax
            </a>
        </div>
    </div>

    <script>
        /* =========================================================
           1. MOTEUR WEBGL & SHADER DE TEXTE PROCÉDURAL
           ========================================================= */
        const canvas = document.getElementById('gl');
        const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
        const loader = document.getElementById('loader');
        const cta = document.getElementById('cta');

        let width, height;
        function resize() {
            const rect = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio, 2);
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);

        // --- VERTEX SHADER ---
        const vsSource = `
            attribute vec2 a_position;
            void main() {
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        // --- FRAGMENT SHADER (La magie opère ici) ---
        const fsSource = `
            precision highp float;
            uniform vec2 u_resolution;
            uniform float u_time;
            
            // Uniforms pour le contrôle du texte et des scènes
            uniform int u_sceneIndex;
            uniform float u_sceneProgress; // 0.0 à 1.0 pour chaque scène
            uniform float u_globalProgress; 
            uniform float u_mood;

            // --- FONCTIONS DE BRUIT ---
            vec2 hash(vec2 p) {
                p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
                return -1.0 + 2.0 * fract(sin(p) * 43758.5453);
            }
            float noise(vec2 p) {
                const float K1 = 0.366025404;
                const float K2 = 0.5 * (sqrt(3.0) - 1.0);
                vec2 i = floor(p + (p.x + p.y) * K1);
                vec2 a = p - i + (i.x + i.y) * K2;
                float m = step(a.y, a.x);
                vec2 o = vec2(m, 1.0 - m);
                vec2 b = a - o + K2;
                vec2 c = a - 1.0 + 2.0 * K2;
                vec3 h = vec3(0.5 * (a.x + a.y), 0.5 * (b.x + b.y), 0.5 * (c.x + c.y));
                vec3 n = vec3(dot(a, hash(i)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
                vec3 w = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
                return 50.0 * dot(n * w * w * w, vec3(1.0));
            }
            float fbm(vec2 p) {
                float v = 0.0, a = 0.5;
                for(int i = 0; i < 5; i++) {
                    v += a * noise(p);
                    p *= 2.0;
                    a *= 0.5;
                }
                return v;
            }

            // --- FONCTIONS DE TEXTE PROCÉDURAL ---
            // Dessine un segment de ligne (pour les lettres)
            float lineSeg(vec2 p, vec2 a, vec2 b, float thick) {
                vec2 pa = p - a, ba = b - a;
                float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
                return length(pa - ba * h) - thick;
            }

            // Forme de texte simplifiée (basée sur des segments et des courbes)
            // On utilise des masques (SDF) pour dessiner les lettres.
            // C'est un alphabet simplifié pour garder le shader léger.
            float getTextMask(vec2 uv, int charCode) {
                // Normalisation de la position
                vec2 p = uv * 2.0 - 1.0;
                float d = 100.0; // Distance par défaut (loin)

                // On gère les caractères un par un (simplifié pour l'exemple)
                // Codes ASCII approximatifs utilisés : 
                // 'L'=76, 'A'=65, 'I'=73, 'D'=68, 'E'=69, 'R'=82, 'O'=79, 'T'=84, ' '=32
                
                if (charCode == 32) { d = 100.0; } // Espace
                
                // L (76)
                else if (charCode == 76) {
                    d = min(lineSeg(p, vec2(-0.4, -0.6), vec2(-0.4, 0.6), 0.08), 
                            lineSeg(p, vec2(-0.4, -0.6), vec2(0.4, -0.6), 0.08));
                }
                // A (65)
                else if (charCode == 65) {
                    d = min(lineSeg(p, vec2(-0.4, -0.6), vec2(0.0, 0.6), 0.08), 
                        min(lineSeg(p, vec2(0.0, 0.6), vec2(0.4, -0.6), 0.08), 
                            lineSeg(p, vec2(-0.2, -0.1), vec2(0.2, -0.1), 0.08)));
                }
                // I (73)
                else if (charCode == 73) {
                    d = min(lineSeg(p, vec2(0.0, -0.6), vec2(0.0, 0.6), 0.08), 
                        min(lineSeg(p, vec2(-0.2, 0.6), vec2(0.2, 0.6), 0.08), 
                            lineSeg(p, vec2(-0.2, -0.6), vec2(0.2, -0.6), 0.08)));
                }
                // D (68)
                else if (charCode == 68) {
                    d = min(lineSeg(p, vec2(-0.3, -0.6), vec2(-0.3, 0.6), 0.08), 
                        min(lineSeg(p, vec2(-0.3, 0.6), vec2(0.1, 0.6), 0.08), 
                        min(lineSeg(p, vec2(-0.3, -0.6), vec2(0.1, -0.6), 0.08), 
                            lineSeg(p, vec2(0.1, 0.6), vec2(0.4, 0.0), 0.08) + 
                            lineSeg(p, vec2(0.4, 0.0), vec2(0.1, -0.6), 0.08))));
                    // Simplification pour D (fermeture)
                    d = min(d, length(p - vec2(0.4, 0.0)) - 0.1);
                }
                // E (69)
                else if (charCode == 69) {
                    d = min(lineSeg(p, vec2(-0.3, -0.6), vec2(-0.3, 0.6), 0.08), 
                        min(lineSeg(p, vec2(-0.3, 0.6), vec2(0.3, 0.6), 0.08), 
                        min(lineSeg(p, vec2(-0.3, 0.0), vec2(0.1, 0.0), 0.08), 
                            lineSeg(p, vec2(-0.3, -0.6), vec2(0.3, -0.6), 0.08))));
                }
                // R (82)
                else if (charCode == 82) {
                    d = min(lineSeg(p, vec2(-0.3, -0.6), vec2(-0.3, 0.6), 0.08), 
                        min(lineSeg(p, vec2(-0.3, 0.6), vec2(0.2, 0.6), 0.08), 
                        min(lineSeg(p, vec2(-0.3, 0.0), vec2(0.2, 0.0), 0.08), 
                            lineSeg(p, vec2(0.2, 0.6), vec2(0.2, 0.0), 0.08))));
                    // Jambe du R
                    d = min(d, lineSeg(p, vec2(0.0, 0.0), vec2(0.3, -0.6), 0.08));
                }
                // O (79)
                else if (charCode == 79) {
                    d = length(p - vec2(0.0, 0.0)) - 0.4;
                }
                // T (84)
                else if (charCode == 84) {
                    d = min(lineSeg(p, vec2(-0.4, 0.6), vec2(0.4, 0.6), 0.08), 
                            lineSeg(p, vec2(0.0, 0.6), vec2(0.0, -0.6), 0.08));
                }

                return d;
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / u_resolution;
                float aspect = u_resolution.x / u_resolution.y;
                vec2 p = uv * 3.0;
                float t = u_time * 0.25;

                // --- 1. GÉNÉRATION DU FOND (Fluide Organique) ---
                vec2 q = vec2(fbm(p + vec2(0.0, t)), fbm(p + vec2(5.2, 1.3) - t));
                vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + 0.15 * t), fbm(p + 4.0 * q + vec2(8.3, 2.8) - 0.126 * t));
                float f = fbm(p + 4.0 * r);

                vec3 cold = vec3(0.10, 0.18, 0.38);
                vec3 cold2 = vec3(0.05, 0.35, 0.45);
                vec3 warm = vec3(0.00, 1.00, 0.61); 
                vec3 warm2 = vec3(0.60, 0.20, 0.55);

                vec3 colA = mix(cold, cold2, f);
                vec3 colB = mix(warm, warm2, f);
                vec3 color = mix(colA, colB, u_mood);

                color *= (0.55 + 0.9 * f);
                
                float d = distance(uv, vec2(0.5));
                color += smoothstep(0.6, 0.0, d) * 0.15 * mix(vec3(0.2, 0.3, 0.6), warm, u_mood);
                color *= smoothstep(0.95, 0.35, d);

                // --- 2. DISTORSION DU TEXTE PAR LE FLUIDE ---
                // On utilise le bruit pour déformer les coordonnées du texte
                vec2 textUv = uv;
                textUv += (vec2(f, fbm(p + 4.0 * r)) - 0.5) * 0.1 * (1.0 - u_sceneProgress);
                
                // --- 3. DESSIN DU TEXTE (Scène par scène) ---
                float textMask = 0.0;
                float outlineMask = 0.0;

                // Configuration de la grille de texte
                float charWidth = 0.15;
                float charHeight = 0.25;
                float lineSpacing = 0.35;
                vec2 textOrigin = vec2(0.5, 0.5);

                // On simule une disposition de texte.
                // C'est une approche simplifiée pour le shader.
                // On définit les positions des lettres en fonction de la scène.
                
                if (u_sceneIndex == 0) {
                    // Scène 1 : "L'AIDE"
                    // On place les lettres manuellement
                    // L
                    vec2 charUv = textUv - (textOrigin + vec2(-0.3, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 76)));
                    // '
                    charUv = textUv - (textOrigin + vec2(-0.15, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 32))); // Espace
                    // A
                    charUv = textUv - (textOrigin + vec2(0.0, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 65)));
                    // I
                    charUv = textUv - (textOrigin + vec2(0.2, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 73)));
                    // D
                    charUv = textUv - (textOrigin + vec2(0.35, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 68)));
                    // E
                    charUv = textUv - (textOrigin + vec2(0.5, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 69)));
                } 
                else if (u_sceneIndex == 1) {
                    // Scène 2 : "UN DROIT"
                    // U (simulé par un D inversé ou juste un O coupé)
                    vec2 charUv = textUv - (textOrigin + vec2(-0.2, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 79))); 
                    // N (simulé)
                    charUv = textUv - (textOrigin + vec2(-0.0, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 65))); 
                    
                    // D
                    charUv = textUv - (textOrigin + vec2(0.2, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 68)));
                    // R
                    charUv = textUv - (textOrigin + vec2(0.35, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 82)));
                    // O
                    charUv = textUv - (textOrigin + vec2(0.5, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 79)));
                    // I
                    charUv = textUv - (textOrigin + vec2(0.65, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 73)));
                    // T
                    charUv = textUv - (textOrigin + vec2(0.75, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 84)));
                }
                else if (u_sceneIndex == 2) {
                    // Scène 3 : "PAS UN LUXE"
                    // P (simulé)
                    vec2 charUv = textUv - (textOrigin + vec2(-0.3, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 82))); 
                    // A
                    charUv = textUv - (textOrigin + vec2(-0.15, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 65)));
                    // S (simulé)
                    charUv = textUv - (textOrigin + vec2(0.0, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 69)));
                    
                    // U
                    charUv = textUv - (textOrigin + vec2(0.2, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 79)));
                    // N
                    charUv = textUv - (textOrigin + vec2(0.35, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 65)));
                    
                    // L
                    charUv = textUv - (textOrigin + vec2(0.55, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 76)));
                    // U
                    charUv = textUv - (textOrigin + vec2(0.7, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 79)));
                    // X
                    charUv = textUv - (textOrigin + vec2(0.85, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 88))); // X approximé par A
                }
                else if (u_sceneIndex == 3) {
                    // Scène 4 : "IPHAX"
                    // I
                    vec2 charUv = textUv - (textOrigin + vec2(-0.3, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 73)));
                    // P (simulé)
                    charUv = textUv - (textOrigin + vec2(-0.15, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 82)));
                    // H (simulé)
                    charUv = textUv - (textOrigin + vec2(0.0, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 76)));
                    // A
                    charUv = textUv - (textOrigin + vec2(0.15, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 65)));
                    // X
                    charUv = textUv - (textOrigin + vec2(0.35, 0.1));
                    textMask = max(textMask, 1.0 - smoothstep(0.0, 0.02, getTextMask(charUv, 65))); // Approx
                }

                // --- 4. INTÉGRATION DU TEXTE AVEC LE FOND ---
                // Effet de lueur (Glow)
                float glow = smoothstep(0.05, 0.0, textMask) * 2.0;
                float core = smoothstep(0.02, 0.0, textMask);

                // Couleur du texte : Vert Iphax quand le mood est chaud, blanc sinon
                vec3 textColor = mix(vec3(1.0), vec3(0.0, 1.0, 0.61), u_mood);
                
                // Appliquer le texte par-dessus le fond
                color = mix(color, textColor * 0.5, glow);
                color = mix(color, vec3(1.0), core);

                // Flash d'apparition (la première seconde de chaque scène)
                float flash = exp(-u_sceneProgress * 10.0) * 0.5;
                color += flash * textColor;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // --- COMPILATION ---
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader error:', gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Program link error:', gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);

        // --- BUFFER ---
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const positionLocation = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        // --- UNIFORMS ---
        const uResolution = gl.getUniformLocation(program, 'u_resolution');
        const uTime = gl.getUniformLocation(program, 'u_time');
        const uSceneIndex = gl.getUniformLocation(program, 'u_sceneIndex');
        const uSceneProgress = gl.getUniformLocation(program, 'u_sceneProgress');
        const uGlobalProgress = gl.getUniformLocation(program, 'u_globalProgress');
        const uMood = gl.getUniformLocation(program, 'u_mood');

        /* =========================================================
           2. LOGIQUE DE SÉQUENÇAGE (Le "réalisateur" de la pub)
           ========================================================= */
        const startTime = performance.now();
        const SCENE_DURATION = 6000; // 6 secondes par scène
        const TOTAL_SCENES = 4;
        
        // Tableau des moods cibles (0 = froid, 1 = chaud)
        const MOODS = [0.2, 0.5, 0.8, 1.0]; 
        let currentMood = 0.0;

        function render(now) {
            const time = (now - startTime) / 1000;
            resize();

            // Calcul de la scène actuelle
            const totalTime = SCENE_DURATION * TOTAL_SCENES;
            const loopedTime = (now - startTime) % totalTime;
            
            const sceneIndex = Math.floor(loopedTime / SCENE_DURATION);
            const sceneProgress = (loopedTime % SCENE_DURATION) / SCENE_DURATION;
            const globalProgress = loopedTime / totalTime;

            // Gestion du bouton d'appel à l'action (Uniquement sur la dernière scène)
            if (sceneIndex === 3 && sceneProgress > 0.5) {
                cta.classList.add('visible');
            } else {
                cta.classList.remove('visible');
            }

            // Transition douce du mood
            currentMood += (MOODS[sceneIndex] - currentMood) * 0.05;

            // Envoi des données au shader
            gl.uniform2f(uResolution, canvas.width, canvas.height);
            gl.uniform1f(uTime, time);
            gl.uniform1i(uSceneIndex, sceneIndex);
            gl.uniform1f(uSceneProgress, sceneProgress);
            gl.uniform1f(uGlobalProgress, globalProgress);
            gl.uniform1f(uMood, currentMood);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }

        // Lancement
        resize();
        requestAnimationFrame(render);
        
        // Cacher le loader une fois le shader prêt
        setTimeout(() => {
            loader.classList.add('hidden');
        }, 500);

    </script>
</body>
</html>
