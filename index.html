<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Chat - Nighty</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0a0a15, #1a0a35);
      color: #e8e8f0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chat-box {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      background: rgba(15, 15, 35, 0.92);
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }

    .chat-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .chat-header .user {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px 14px;
      background: #1a1a35;
      border-radius: 12px;
      max-width: 75%;
      word-wrap: break-word;
      animation: apparition 0.3s ease;
    }

    .message.moi {
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      align-self: flex-end;
    }

    .message .auteur {
      font-size: 0.75rem;
      font-weight: 700;
      color: #c4b5fd;
      margin-bottom: 4px;
    }

    .message.moi .auteur {
      color: #ffffff;
      opacity: 0.9;
    }

    .message .texte {
      font-size: 0.95rem;
      line-height: 1.4;
    }

    @keyframes apparition {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .chat-input {
      padding: 12px;
      background: #0f0f22;
      border-top: 1px solid #2a2a4a;
      display: flex;
      gap: 8px;
    }

    .chat-input input {
      flex: 1;
      padding: 13px 16px;
      background: #1a1a35;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      color: #e8e8f0;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input input:focus { border-color: #7c3aed; }

    .chat-input button {
      padding: 13px 22px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chat-input button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.6);
    }

    /* ============ ÉCRAN DE CONNEXION ============ */
    .auth-box {
      width: 100%;
      max-width: 400px;
      background: rgba(15, 15, 35, 0.92);
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }

    .auth-box h1 {
      text-align: center;
      color: #c4b5fd;
      font-size: 1.8rem;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .auth-box input {
      width: 100%;
      padding: 13px 16px;
      margin-bottom: 12px;
      background: #0f0f22;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      color: #e8e8f0;
      font-size: 0.95rem;
      outline: none;
    }

    .auth-box input:focus { border-color: #7c3aed; }

    .auth-box button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .auth-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.6);
    }

    .message-auth {
      text-align: center;
      font-size: 0.85rem;
      min-height: 18px;
      color: #f87171;
      margin-top: 10px;
    }

    .message-auth.succes { color: #4ade80; }

    .cache { display: none !important; }
  </style>
</head>
<body>

  <!-- ÉCRAN CONNEXION -->
  <div id="ecran-auth" class="auth-box">
    <h1>🌙 Nighty Chat</h1>
    <input type="text" id="pseudo" placeholder="Pseudo" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="mdp" placeholder="Mot de passe (6 caractères min)" required>
    <button id="btn-inscription">Créer un compte</button>
    <button id="btn-connexion">Se connecter</button>
    <p id="message-auth" class="message-auth"></p>
  </div>

  <!-- ÉCRAN CHAT -->
  <div id="ecran-chat" class="chat-box cache">
    <div class="chat-header">
      <h1>🌙 Chat Nighty</h1>
      <span class="user" id="user-actuel">Connecté</span>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
      <input type="text" id="chat-input-texte" placeholder="Écris ton message..." autocomplete="off">
      <button id="btn-envoyer">Envoyer</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
