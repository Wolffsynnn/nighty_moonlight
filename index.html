<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Nighty — Saison 1 : NIGHTMARES</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  svg { width: 100vw; height: 100vh; display: block; }

  /* ============ CIEL PULSANT ============ */
  .sky-pulse { animation: skyPulse 6s ease-in-out infinite; }
  @keyframes skyPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.88; }
  }

  /* ============ BROUILLARD ============ */
  .fog-1 { animation: fogMove1 30s linear infinite; }
  .fog-2 { animation: fogMove2 40s linear infinite; }
  .fog-3 { animation: fogMove1 50s linear infinite reverse; }
  .fog-4 { animation: fogMove2 35s linear infinite reverse; }
  @keyframes fogMove1 {
    0%   { transform: translateX(-300px); }
    100% { transform: translateX(300px); }
  }
  @keyframes fogMove2 {
    0%   { transform: translateX(250px); }
    100% { transform: translateX(-250px); }
  }

  /* ============ LUNE QUI MONTE ============ */
  .moon-rise {
    animation: moonRise 5s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
    transform: translateY(900px);
    opacity: 0;
  }
  @keyframes moonRise {
    0%   { transform: translateY(900px); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .moon-glow-1 { animation: moonGlow 5s ease-in-out infinite; }
  .moon-glow-2 { animation: moonGlow 3s ease-in-out infinite; animation-delay: -1.5s; }
  @keyframes moonGlow {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.85; }
  }

  /* ============ CORBEAUX ============ */
  .crow      { animation: crowFly 16s linear infinite; }
  .crow-2    { animation-delay: -4s; }
  .crow-3    { animation-delay: -8s; }
  .crow-4    { animation-delay: -12s; }
  @keyframes crowFly {
    0%   { transform: translate(-300px, 0); opacity: 0; }
    8%   { opacity: 0.9; }
    92%  { opacity: 0.9; }
    100% { transform: translate(2300px, -120px); opacity: 0; }
  }
  .wing-1 { animation: wing1 0.35s linear infinite; transform-origin: center; }
  .wing-2 { animation: wing2 0.35s linear infinite; transform-origin: center; }
  @keyframes wing1 { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }
  @keyframes wing2 { 0%,100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }

  /* ============ BRAISES ============ */
  .ember { animation: emberFloat 7s ease-in-out infinite; }
  @keyframes emberFloat {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 0.4; }
    100% { transform: translateY(-500px) scale(0.2); opacity: 0; }
  }

  /* ============ TITRE NIGHTY ============ */
  .title-nighty {
    opacity: 0;
    transform-origin: 960px 500px;
    animation: nightyReveal 3s cubic-bezier(0.16, 1, 0.3, 1) 9s forwards;
  }
  @keyframes nightyReveal {
    0%   { opacity: 0; letter-spacing: 120px; transform: scale(0.6); filter: blur(40px); }
    55%  { opacity: 1; letter-spacing: 15px; transform: scale(1.05); filter: blur(0); }
    75%  { transform: scale(0.98); }
    100% { opacity: 1; letter-spacing: 10px; transform: scale(1); filter: blur(0); }
  }

  .title-nighty-glow {
    animation: titleGlowPulse 4s ease-in-out infinite;
    animation-delay: 12s;
    opacity: 0;
  }
  @keyframes titleGlowPulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.75; }
  }

  /* ============ STUDIO ============ */
  .studio-text {
    opacity: 0;
    animation: studioReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) 12s forwards;
  }
  @keyframes studioReveal {
    from { opacity: 0; transform: translateY(25px); letter-spacing: 25px; }
    to   { opacity: 0.95; transform: translateY(0); letter-spacing: 8px; }
  }

  /* ============ SOUS-TITRE ============ */
  .sub-text {
    opacity: 0;
    animation: subReveal 1.5s ease-out 14s forwards;
  }
  @keyframes subReveal {
    from { opacity: 0; transform: translateY(15px); letter-spacing: 20px; }
    to   { opacity: 0.85; transform: translateY(0); letter-spacing: 14px; }
  }

  /* ============ EFFACEMENT GROUPE 1 ============ */
  .fade-out-group-1 {
    animation: fadeOutGroup 1.2s ease-out 16.5s forwards;
  }
  @keyframes fadeOutGroup {
    from { opacity: 1; filter: blur(0); }
    to   { opacity: 0; filter: blur(15px); }
  }

  /* ============ SAISON 1 ============ */
  .saison-text {
    opacity: 0;
    animation: saisonReveal 2s cubic-bezier(0.16, 1, 0.3, 1) 18s forwards;
  }
  @keyframes saisonReveal {
    from { opacity: 0; letter-spacing: 50px; filter: blur(15px); }
    to   { opacity: 1; letter-spacing: 15px; filter: blur(0); }
  }

  /* ============ NIGHTMARES ============ */
  .nightmares-text {
    opacity: 0;
    transform-origin: 960px 720px;
    animation: nightmaresSlam 2.5s cubic-bezier(0.16, 1, 0.3, 1) 20s forwards;
  }
  @keyframes nightmaresSlam {
    0%   { opacity: 0; letter-spacing: 100px; transform: scale(1.6); filter: blur(30px); }
    40%  { opacity: 1; letter-spacing: 8px; transform: scale(0.94); filter: blur(0); }
    60%  { transform: scale(1.03); }
    80%  { transform: scale(0.99); }
    100% { opacity: 1; letter-spacing: 6px; transform: scale(1); filter: blur(0); }
  }

  .nightmares-shake {
    animation: nightShake 0.15s linear 22.5s infinite;
  }
  @keyframes nightShake {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(-2px, 1px); }
    50%      { transform: translate(1px, -1px); }
    75%      { transform: translate(-1px, -1px); }
  }

  /* ============ SANG QUI COULE ============ */
  .blood { animation: bloodDrip 4s ease-in 23s forwards; opacity: 0; }
  .blood-2 { animation-delay: 23.4s; }
  .blood-3 { animation-delay: 23.8s; }
  @keyframes bloodDrip {
    0%   { opacity: 0; transform: scaleY(0); transform-origin: top; }
    20%  { opacity: 1; transform: scaleY(1); }
    100% { opacity: 1; transform: translateY(60px); }
  }

  /* ============ BIENTOT ============ */
  .soon-text {
    opacity: 0;
    animation: soonPulse 3s ease-in-out 25s infinite;
  }
  @keyframes soonPulse {
    0%, 100% { opacity: 0.25; letter-spacing: 10px; }
    50%      { opacity: 1;    letter-spacing: 18px; }
  }

  /* ============ ECLAIR ============ */
  .lightning {
    animation: lightningFlash 12s ease-in-out infinite;
    opacity: 0;
  }
  @keyframes lightningFlash {
    0%, 88%, 93%, 100% { opacity: 0; }
    89%, 91%           { opacity: 0.6; }
    90%                { opacity: 0.25; }
  }

  /* ============ SCANLINES ============ */
  .scanlines { animation: scanMove 8s linear infinite; opacity: 0.07; }
  @keyframes scanMove {
    0%   { transform: translateY(0); }
    100% { transform: translateY(40px); }
  }

  /* ============ VIGNETTE ============ */
  .vignette { animation: vignettePulse 5s ease-in-out infinite; }
  @keyframes vignettePulse {
    0%, 100% { opacity: 0.9; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>

<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Ciel rouge sombre -->
    <radialGradient id="skyGrad" cx="50%" cy="55%" r="80%">
      <stop offset="0%"   stop-color="#4a0404"/>
      <stop offset="25%"  stop-color="#2a0202"/>
      <stop offset="55%"  stop-color="#120000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Halo lune -->
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff3030" stop-opacity="0.75"/>
      <stop offset="40%"  stop-color="#a00000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Corps lune -->
    <radialGradient id="moonBody" cx="42%" cy="38%" r="70%">
      <stop offset="0%"   stop-color="#ff6060"/>
      <stop offset="35%"  stop-color="#cc1a1a"/>
      <stop offset="75%"  stop-color="#7a0808"/>
      <stop offset="100%" stop-color="#3a0202"/>
    </radialGradient>

    <!-- Brouillard -->
    <radialGradient id="fogGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a00000" stop-opacity="0.4"/>
      <stop offset="60%"  stop-color="#6a0000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo titre -->
    <radialGradient id="titleHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff0000" stop-opacity="0.6"/>
      <stop offset="55%"  stop-color="#8b0000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>

    <filter id="blurFog"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="blurBig"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blurHalo"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="blurMoon"><feGaussianBlur stdDeviation="6"/></filter>

    <filter id="titleGlowBig">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="redGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== CIEL ==================== -->
  <rect class="sky-pulse" width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- ==================== ECLAIR ==================== -->
  <rect class="lightning" width="1920" height="1080" fill="#ff0000"/>

  <!-- ==================== SCANLINES ==================== -->
  <g class="scanlines">
    <rect y="0"    width="1920" height="2" fill="#ff0000"/>
    <rect y="60"   width="1920" height="1" fill="#ff0000"/>
    <rect y="120"  width="1920" height="2" fill="#ff0000"/>
    <rect y="220"  width="1920" height="1" fill="#ff0000"/>
    <rect y="340"  width="1920" height="2" fill="#ff0000"/>
    <rect y="480"  width="1920" height="1" fill="#ff0000"/>
    <rect y="620"  width="1920" height="2" fill="#ff0000"/>
    <rect y="760"  width="1920" height="1" fill="#ff0000"/>
    <rect y="900"  width="1920" height="2" fill="#ff0000"/>
    <rect y="1020" width="1920" height="1" fill="#ff0000"/>
  </g>

  <!-- ==================== LUNE ROUGE ==================== -->
  <g class="moon-rise">
    <circle class="moon-glow-1" cx="960" cy="440" r="440" fill="url(#moonHalo)" filter="url(#blurHalo)"/>
    <circle class="moon-glow-2" cx="960" cy="440" r="280" fill="url(#moonHalo)" filter="url(#blurBig)"/>
    <circle cx="960" cy="440" r="200" fill="url(#moonBody)" filter="url(#blurMoon)"/>
    <g fill="#5a0505" opacity="0.55">
      <circle cx="880" cy="380" r="30"/>
      <circle cx="1040" cy="420" r="25"/>
      <circle cx="900" cy="500" r="35"/>
      <circle cx="1010" cy="520" r="20"/>
      <circle cx="930" cy="460" r="15"/>
      <circle cx="1000" cy="360" r="12"/>
      <circle cx="860" cy="450" r="10"/>
    </g>
    <circle cx="900" cy="380" r="180" fill="#ff8888" opacity="0.14" filter="url(#blurBig)"/>
  </g>

  <!-- ==================== BROUILLARD ==================== -->
  <g filter="url(#blurFog)">
    <ellipse class="fog-1" cx="500"  cy="850"  rx="800" ry="450" fill="url(#fogGrad)"/>
    <ellipse class="fog-2" cx="1400" cy="900"  rx="850" ry="400" fill="url(#fogGrad)"/>
    <ellipse class="fog-3" cx="960"  cy="1000" rx="1000" ry="350" fill="url(#fogGrad)"/>
    <ellipse class="fog-4" cx="700"  cy="1050" rx="900" ry="300" fill="url(#fogGrad)"/>
  </g>

  <!-- ==================== MONTAGNES ==================== -->
  <g fill="#000000">
    <path d="M 0 1080 L 0 850 L 150 750 L 280 830 L 420 720 L 550 810 L 700 700 L 850 780 L 960 660 L 1100 750 L 1250 690 L 1400 780 L 1550 720 L 1700 820 L 1830 760 L 1920 830 L 1920 1080 Z" opacity="0.85"/>
    <path d="M 0 1080 L 0 950 L 200 870 L 350 920 L 500 850 L 650 900 L 800 880 L 920 950 L 1000 920 L 1100 960 L 1250 900 L 1400 940 L 1550 880 L 1700 950 L 1850 900 L 1920 970 L 1920 1080 Z"/>
  </g>

  <!-- ==================== CORBEAUX ==================== -->
  <g fill="#000000" stroke="#1a0000" stroke-width="1.2">
    <g class="crow crow-1">
      <g transform="translate(0, 200)">
        <path class="wing-1" d="M 0 0 Q -22 -14 -36 -8 Q -22 0 0 8 Q 22 0 36 -8 Q 22 -14 0 0 Z"/>
      </g>
    </g>
    <g class="crow crow-2">
      <g transform="translate(0, 320) scale(0.7)">
        <path class="wing-2" d="M 0 0 Q -22 -14 -36 -8 Q -22 0 0 8 Q 22 0 36 -8 Q 22 -14 0 0 Z"/>
      </g>
    </g>
    <g class="crow crow-3">
      <g transform="translate(0, 130) scale(1.1)">
        <path class="wing-1" d="M 0 0 Q -22 -14 -36 -8 Q -22 0 0 8 Q 22 0 36 -8 Q 22 -14 0 0 Z"/>
      </g>
    </g>
    <g class="crow crow-4">
      <g transform="translate(0, 400) scale(0.85)">
        <path class="wing-2" d="M 0 0 Q -22 -14 -36 -8 Q -22 0 0 8 Q 22 0 36 -8 Q 22 -14 0 0 Z"/>
      </g>
    </g>
  </g>

  <!-- ==================== BRAISES ==================== -->
  <g fill="#ff4020">
    <circle class="ember" cx="300"  cy="800" r="2"/>
    <circle class="ember" cx="600"  cy="900" r="1.5" style="animation-delay: 1s"/>
    <circle class="ember" cx="900"  cy="850" r="2.5" style="animation-delay: 2s"/>
    <circle class="ember" cx="1200" cy="900" r="1.8" style="animation-delay: 3s"/>
    <circle class="ember" cx="1500" cy="820" r="2"   style="animation-delay: 4s"/>
    <circle class="ember" cx="1700" cy="880" r="1.5" style="animation-delay: 5s"/>
    <circle class="ember" cx="400"  cy="950" r="2.2" style="animation-delay: 2.5s"/>
    <circle class="ember" cx="1300" cy="980" r="1.8" style="animation-delay: 1.5s"/>
  </g>

  <!-- ==================== VIGNETTE ==================== -->
  <rect class="vignette" width="1920" height="1080" fill="url(#vignetteGrad)" pointer-events="none"/>

  <!-- ==================== GROUPE 1 : NIGHTY + STUDIO + SOUS-TITRE ==================== -->
  <g class="fade-out-group-1">
    <!-- Titre NIGHTY -->
    <g class="title-nighty">
      <text x="960" y="500"
            text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="240"
            font-weight="900"
            fill="#ffffff"
            letter-spacing="10"
            filter="url(#titleGlowBig)">Nighty</text>
      <text x="960" y="500"
            text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="240"
            font-weight="900"
            fill="none"
            stroke="#ff4040"
            stroke-width="1.2"
            letter-spacing="10"
            opacity="0.8">Nighty</text>
    </g>

    <!-- Sous-titre studio -->
    <text class="studio-text"
          x="960" y="590"
          text-anchor="middle"
          font-family="Georgia, serif"
          font-size="30"
          font-weight="400"
          fill="#f0d8d8"
          letter-spacing="8">By MoonLight Studio</text>

    <!-- Sous-titre jeu -->
    <text class="sub-text"
          x="960" y="670"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="24"
          font-weight="300"
          fill="#d0a8a8"
          letter-spacing="14">LOUP-GAROU EN LIGNE</text>
  </g>

  <!-- ==================== GROUPE 2 : SAISON 1 + NIGHTMARES ==================== -->
  <!-- SAISON 1 -->
  <text class="saison-text"
        x="960" y="480"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="300"
        fill="#ffffff"
        letter-spacing="15"
        opacity="0.9">SAISON 1</text>

  <!-- NIGHTMARES (avec glitch shake) -->
  <g class="nightmares-shake">
    <text class="nightmares-text"
          x="960" y="720"
          text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="200"
          font-weight="900"
          fill="#ff0000"
          letter-spacing="6"
          filter="url(#titleGlowBig)">NIGHTMARES</text>
    <text class="nightmares-text"
          x="960" y="720"
          text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="200"
          font-weight="900"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.2"
          letter-spacing="6"
          style="animation-delay: 20s;">NIGHTMARES</text>
  </g>

  <!-- Sang qui coule -->
  <g class="blood">
    <path d="M 700 770 L 700 850 Q 695 880 700 910 Q 705 880 700 850 Z" fill="#8b0000"/>
    <circle cx="700" cy="920" r="8" fill="#8b0000"/>
  </g>
  <g class="blood blood-2">
    <path d="M 960 780 L 960 880 Q 954 915 960 950 Q 966 915 960 880 Z" fill="#8b0000"/>
    <circle cx="960" cy="965" r="10" fill="#8b0000"/>
  </g>
  <g class="blood blood-3">
    <path d="M 1220 770 L 1220 840 Q 1215 865 1220 890 Q 1225 865 1220 840 Z" fill="#8b0000"/>
    <circle cx="1220" cy="900" r="7" fill="#8b0000"/>
  </g>

  <!-- BIENTÔT -->
  <text class="soon-text"
        x="960" y="1010"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        font-weight="400"
        fill="#ff6060"
        letter-spacing="12">BIENTÔT</text>

</svg>

</body>
</html>
